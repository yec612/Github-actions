name: Hola Mundo

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      platform: aws
      region: us-east-1
      account: development

    steps:
      - name: Mostrar mensaje inicial
        run: echo "Hola Mundo"

      - name: Auditoría de variables de entorno
        run: |
          echo "Plataforma de despliegue: ${{ env.platform }}"
          echo "Región asignada: ${{ env.region }}"
          echo "Entorno de cuenta: ${{ env.account }}"
          
      - name: Despliegue en AWS
        if: env.platform == 'aws'
        run: echo "Ejecutando tareas para AWS"

      - name: Despliegue en Azure
        if: env.platform == 'azure'
        run: echo "Ejecutando tareas para Azure"

      - name: Mostrar Metadatos Básicos
        run: |
          echo "Usuario ejecutor: ${{ github.actor }}"
          echo "Repositorio activo: ${{ github.repository }}"

      - name: Debug del payload completo
        run: echo '${{ toJSON(github.event) }}'

      - name: Validación de Credenciales
        env:
          USER_NAME: ${{ secrets.USERNAME }}
          USER_PASS: ${{ secrets.PASSWORD }}
        if: ${{ env.USER_NAME != '' && env.USER_PASS != '' }}
        run: |
          echo "Estado: Credenciales de autenticación detectadas. Procediendo..."

      - name: Referencia a Variable Global
        run: |
          echo "Versión del proyecto: ${{ vars.PROJECT_VERSION }}"

